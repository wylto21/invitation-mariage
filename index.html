<style>
  /* Règles propres à la page d'intro (lecommun est dans styles.css) */

  .env-scene { cursor: pointer; }
  .env-scene.open { cursor: default; }
  .env-scene.bye { display: none; }

  /* ---------- scène photo (au centre, derrière l'enveloppe) ---------- */
  .photo-stage {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(78vw, 320px); aspect-ratio: 3 / 4;
    z-index: 1;
  }
  .photo-card {
    position: absolute; inset: 0;
    border-radius: 14px; overflow: hidden;
    background: linear-gradient(160deg, #fdf8f2, #ecd9c0);
    border: 1px solid rgba(184,92,56,.25);
    box-shadow: 0 26px 60px rgba(74,36,22,.28), inset 0 0 0 5px rgba(201,165,94,.22);
    opacity: 0; transform: translateY(26px) scale(.94);
    transition: opacity .8s ease 1.25s, transform 1s cubic-bezier(.2,.85,.3,1.05) 1.25s;
  }
  .photo-card.show { opacity: 1; transform: translateY(0) scale(1); }
  .photo-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-card img.hidden { display: none; }
  .ph-mono {
    display: none; position: absolute; inset: 0;
    align-items: center; justify-content: center; flex-direction: column; gap: 4px;
    font-family: 'Pinyon Script', cursive; font-size: clamp(42px, 12.6vw, 58px); font-weight: 400;
    letter-spacing: 0; color: var(--deep);
    background: linear-gradient(160deg, #f6ede3, #ecd9c0);
  }
  .ph-mono span { font-family: 'Pinyon Script', cursive; font-size: .78em; color: var(--terra); }
  .photo-card.nophoto .ph-mono { display: flex; }
  .photo-card::after {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(255,251,244,.6); border-radius: 9px;
    pointer-events: none; z-index: 2;
  }

  /* CTA sur la photo : capitales espacees (le script est reserve aux prenoms) */
  .open-cta {
    position: absolute; left: 50%; bottom: 20px;
    transform: translateX(-50%) translateY(12px);
    opacity: 0; z-index: 3;
    display: inline-block; text-decoration: none; cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px; font-weight: 500; line-height: 1; letter-spacing: .22em; text-transform: uppercase;
    color: #fff8f0; text-align: center; white-space: nowrap;
    padding: 13px 30px;
    background: linear-gradient(100deg, rgba(138,52,22,.9), rgba(184,92,56,.85) 50%, rgba(138,52,22,.9));
    border-radius: 2px;
    border: 1px solid rgba(232,181,154,.7);
    box-shadow: 0 8px 26px rgba(74,36,22,.4);
    text-shadow: 0 2px 8px rgba(74,36,22,.4);
    backdrop-filter: blur(3px);
    transition: opacity .6s ease 2s, transform .6s ease 2s, box-shadow .25s ease, background .25s ease;
  }
  .photo-card.show .open-cta { opacity: 1; transform: translateX(-50%) translateY(0); }
  .open-cta:hover { box-shadow: 0 10px 30px rgba(74,36,22,.5); background: linear-gradient(100deg, rgba(184,92,56,.95), rgba(201,123,78,.9) 50%, rgba(184,92,56,.95)); }

  @media (prefers-reduced-motion: reduce) {
    .env-scene, .env-flap, .photo-card, .open-cta, .wax-seal { transition-duration: .01s !important; transition-delay: 0s !important; }
  }


  /* ============================================================
     INTRO : ENVELOPPE FLEURIE → PHOTO → CTA
     ============================================================ */
  .intro {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(52% 44% at 50% 46%, rgba(255,251,246,.75) 0%, transparent 70%),
      radial-gradient(46% 40% at 12% 10%, rgba(201,165,94,.16) 0%, transparent 64%),
      radial-gradient(44% 38% at 90% 16%, rgba(201,123,78,.14) 0%, transparent 64%),
      radial-gradient(50% 44% at 88% 92%, rgba(168,134,94,.2) 0%, transparent 64%),
      linear-gradient(165deg, #f9f2ea 0%, #f1e4d6 52%, #e8d9c5 100%);
    perspective: 1200px;
    overflow: hidden;
    transition: opacity .55s ease;
  }
  .intro.fade { opacity: 0; }

  /* ---------- grandillage floral de l'intro ---------- */
  .garland { position: absolute; pointer-events: none; z-index: 1; }
  .garland svg { width: 100%; height: 100%; display: block; }
  .garland.tl { top: -3.5%; left: -4%;  width: min(46vw, 330px); transform: rotate(-8deg); }
  .garland.tr { top: -3.5%; right: -4%; width: min(46vw, 330px); transform: scaleX(-1) rotate(-8deg); }
  .garland.bl { bottom: -4%; left: -5%;  width: min(42vw, 300px); transform: scaleY(-1) rotate(-8deg); }
  .garland.br { bottom: -4%; right: -5%; width: min(42vw, 300px); transform: scale(-1) rotate(-8deg); }
  @media (max-width: 720px) {
    .garland.tl, .garland.tr { width: 62vw; }
    .garland.bl, .garland.br { display: none; }
  }

  /* ---------- contenu de l'enveloppe : LES ALLIANCES ---------- */
  .env-art {
    position: absolute; left: 50%; bottom: 11%;
    transform: translateX(-50%);
    width: 44%; z-index: 1; text-align: center; pointer-events: none;
  }
  .env-art .rings-svg { width: 128%; height: auto; display: block; margin: -8% auto 0; }
  .env-art .mono {
    margin-top: 6px; font-family: 'Pinyon Script', cursive;
    font-size: clamp(19px, 5.8vw, 28px); font-weight: 400; letter-spacing: 0;
    color: var(--deep); line-height: 1.1;
  }
  .env-art .mono span { font-family: 'Pinyon Script', cursive; color: var(--gold); }
  .env-art .date {
    margin-top: 6px; font-size: 7px; letter-spacing: .3em;
    text-transform: uppercase; color: var(--sand); font-weight: 500;
  }
  /* la signature s'efface quand l'enveloppe s'éloigne vers la photo */
  .env-art, .env-scatter, .env-inset { transition: opacity .4s ease; }
  .env-scene.away .env-art,
  .env-scene.away .env-scatter,
  .env-scene.away .env-inset { opacity: 0; }

  /* petites fleurs éparpillées sur le corps de l'enveloppe */
  .env-scatter { position: absolute; inset: 0; pointer-events: none; z-index: 1; filter: drop-shadow(0 3px 6px rgba(74,36,22,.18)); }
  .env-scatter use { position: absolute; }
  .env-scatter .f1 { left: 7%;   top: 62%; width: 15px; height: 15px; }
  .env-scatter .f2 { right: 9%;  top: 66%; width: 14px; height: 14px; }
  .env-scatter .f3 { left: 16%;  top: 77%; width: 12px; height: 12px; }
  .env-scatter .f4 { right: 17%; top: 59%; width: 11px; height: 11px; }
  .env-scatter .f5 { left: 26%;  top: 85%; width: 10px; height: 10px; }
  .env-scatter .f6 { right: 28%; top: 84%; width: 10px; height: 10px; }
  .env-scatter .f7 { left: 4%;   top: 84%; width: 9px;  height: 9px;  }
  .env-scatter .f8 { right: 4%;  top: 80%; width: 9px;  height: 9px;  }
  .env-scatter .f9 { left: 34%;  top: 57%; width: 8px;  height: 8px;  }
  .env-scatter .f10{ right: 35%; top: 60%; width: 8px;  height: 8px;  }
  .env-scatter .b1 { left: 2%;   top: 54%; width: 32px; height: 32px; opacity: .85; }
  .env-scatter .b2 { right: 1%;  top: 72%; width: 30px; height: 30px; opacity: .85; }
  .env-scatter .l1 { left: 5%;   top: 72%; width: 19px; height: 19px; opacity: .9; }
  .env-scatter .l2 { right: 6%;  top: 77%; width: 17px; height: 17px; opacity: .9; }
  .env-scatter .l3 { left: 13%;  top: 88%; width: 14px; height: 14px; opacity: .8; }
  .env-scatter .l4 { right: 14%; top: 88%; width: 13px; height: 13px; opacity: .8; }

  /* ramure fleurie dans les bas-corners du corps de l'enveloppe */
  .env-corners { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .95; filter: drop-shadow(0 6px 14px rgba(31,83,64,.22)); }

  /* contour floral intérieur de l'enveloppe */
  .env-inset {
    position: absolute; inset: 9px; z-index: 1; pointer-events: none;
    border: 1px solid rgba(184,92,56,.22); border-radius: 5px;
  }
  .env-inset::after {
    content: ""; position: absolute; inset: 4px;
    border: 1px dashed rgba(201,165,94,.4); border-radius: 3px;
  }

  .env-scene {
    position: absolute; left: 50%; top: 50%;
    width: min(86vw, 340px); aspect-ratio: 10 / 7;
    transform: translate(-50%, -50%);
    z-index: 4;
    perspective: 1000px;
    transition: transform .3s ease, opacity .65s ease .8s;
  }
  .env-scene:not(.open):hover { transform: translate(-50%, -52%); }
  .env-scene.away {
    transform: translate(-50%, 120vh) rotate(-6deg); opacity: .35;
    transition: transform .95s cubic-bezier(.55,0,.7,.45) .7s, opacity .65s ease .8s;
  }
  .env-scene.opening { animation: env-pop .5s ease; }
  @keyframes env-pop {
    0% { transform: translate(-50%, -50%) scale(1); }
    40% { transform: translate(-50%, -50%) scale(1.05); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  /* corps de l'enveloppe — velours sombre, pas papier */
  .env-body {
    position: absolute; inset: 0;
    background: linear-gradient(165deg, #fdf8f2 0%, #f6ede3 52%, #f0e0cd 100%);
    border: 1px solid rgba(184,92,56,.22);
    border-radius: 8px;
    box-shadow: 0 20px 56px rgba(74,36,22,.24), inset 0 0 0 4px rgba(201,165,94,.2);
    z-index: 2;
  }
  .env-body::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 62%;
    background: linear-gradient(170deg, rgba(184,92,56,.06), rgba(184,92,56,.14));
    clip-path: polygon(0 100%, 50% 12%, 100% 100%);
    border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
    pointer-events: none;
  }
  /* env-sprig retiré : remplacé par .env-corners (ramures du sprite) */

  /* rabat supérieur qui pivote */
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%;
    transform-origin: top center;
    z-index: 6;
    transition: transform .8s cubic-bezier(.65,-0.25,.35,1.25) .1s;
  }
  .env-flap::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, #f3e6d4 0%, #ecd9c0 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-top-left-radius: 8px; border-top-right-radius: 8px;
    border: 1px solid rgba(184,92,56,.2);
    box-shadow: 0 6px 16px rgba(74,36,22,.16);
    backface-visibility: hidden;
  }
  .flap-art {
    position: absolute; inset: 0;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    pointer-events: none;
  }
  .flap-art .cluster { position: absolute; left: 50%; bottom: 3%; width: 86%; transform: translateX(-50%); }
  /* .bud retiré : remplacé par les fleurs du sprite */
  .env-scene.open .env-flap { transform: rotateX(178deg); z-index: 0; }

  /* cachet de cire */
  .wax-seal {
    position: absolute; left: 50%; top: 55%;
    transform: translate(-50%, -50%);
    width: 62px; height: 62px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #d4794b, #b85c38 55%, #8a3416 100%);
    box-shadow: 0 5px 16px rgba(138,52,22,.4), inset 0 2px 7px rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center;
    z-index: 7; cursor: pointer; border: none; padding: 0;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .wax-seal:hover { transform: translate(-50%, -50%) scale(1.08); }
  .wax-seal svg { width: 34px; height: 34px; }
  .wax-seal::before {
    content: ""; position: absolute; inset: -12px; border-radius: 50%;
    border: 2px solid rgba(184,92,56,.5);
    animation: seal-pulse 2.2s ease-out infinite;
  }
  @keyframes seal-pulse {
    0% { transform: scale(.85); opacity: .9; }
    70% { transform: scale(1.35); opacity: 0; }
    100% { opacity: 0; }
  }
  .env-scene.open .wax-seal { animation: seal-fade .5s ease forwards; pointer-events: none; }
  @keyframes seal-fade { to { opacity: 0; transform: translate(-50%, -50%) scale(.6); } }


</style>
</head>

  <script>
    (function () {
      var intro = document.getElementById('intro');
      var envScene = document.getElementById('envScene');
      var photoCard = document.getElementById('photoCard');
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function openEnvelope() {
        if (envScene.classList.contains('open')) return;
        envScene.classList.add('opening');
        setTimeout(function () { envScene.classList.remove('opening'); }, 520);
        envScene.classList.add('open');

        /* la photo apparaît derrière l'enveloppe, puis celle-ci glisse hors de l'écran */
        setTimeout(function () {
          photoCard.classList.add('show');
          envScene.classList.add('away');
        }, reduced ? 0 : 700);
        setTimeout(function () { envScene.classList.add('bye'); }, reduced ? 100 : 2500);
      }

      /* clic sur le cachet, le rabat ou l'enveloppe entière → ouverture */
      document.getElementById('seal').addEventListener('click', function (e) { e.stopPropagation(); openEnvelope(); });
      envScene.addEventListener('click', openEnvelope);

      /* CTA sur la photo → page RSVP ancrée sur les réservations */
      document.getElementById('openCta').addEventListener('click', function (e) {
        e.stopPropagation();
        intro.classList.add('fade');
        setTimeout(function () {
          window.location.href = 'invitation-landing.html#reserver';
        }, reduced ? 30 : 500);
      });
    })();
  </script>
