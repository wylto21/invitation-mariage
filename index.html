<style>
  /* Règles propres à la page d'intro (le commun est dans styles.css).
     Mise en page reprise du modèle « Invitation au mariage de » :
     fond fleuri, titre, prénoms en script, date, enveloppe fleurie. */

  .intro {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(14px, 3.4vh, 34px);
    padding: clamp(28px, 6vh, 64px) 0 clamp(18px, 4vh, 40px);
    background: #fdfaf6 url("assets/invitation/fond-fleuri.jpg") center / cover no-repeat;
    overflow: hidden;
    transition: opacity .55s ease;
  }
  .intro.fade { opacity: 0; }

  /* ---------- en-tête : titre, filet, prénoms, date ---------- */
  .intro-head {
    text-align: center; padding: 0 16px; width: 100%;
    transition: opacity .5s ease, transform .6s ease;
  }
  .intro.open .intro-head { opacity: 0; transform: translateY(-18px); pointer-events: none; }
  .ih-kicker {
    font-family: 'Jost', sans-serif; font-weight: 400;
    font-size: clamp(13px, 3.4vw, 17px); letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink); padding-left: .14em;
  }
  .ih-title {
    font-family: 'Cinzel', serif; font-weight: 400;
    font-size: clamp(34px, 9.4vw, 54px); line-height: 1.05; letter-spacing: .02em;
    color: var(--ink); margin-top: .12em; word-spacing: .12em;
  }
  .ih-filet { display: block; width: min(66vw, 360px); height: auto; margin: clamp(10px, 2vh, 18px) auto 0; }
  .ih-names {
    font-family: 'Monsieur La Doulaise','Great Vibes', cursive; font-weight: 400;
    font-size: clamp(42px, 12.4vw, 76px); line-height: 1.12; letter-spacing: 0;
    color: var(--terra); margin-top: clamp(14px, 3vh, 30px);
  }
  .ih-names .fn { white-space: nowrap; }
  .ih-date {
    font-family: 'Jost', sans-serif; font-weight: 500;
    font-size: clamp(14px, 4vw, 20px); letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink); margin-top: .5em;
  }
  .ih-hint {
    margin-top: clamp(22px, 5vh, 52px);
    font-family: 'Jost', sans-serif; font-weight: 400;
    font-size: clamp(12px, 3.3vw, 15px); letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink); padding-left: .16em;
  }
  .ih-chev { display: block; width: 22px; height: 12px; margin: 10px auto 0; animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }

  /* ---------- enveloppe fleurie (image) + monogramme ---------- */
  .env-scene {
    position: relative; flex: none;
    width: min(100vw, 620px); aspect-ratio: 2 / 1;
    margin: 0; padding: 0; border: 0; background: none; cursor: pointer;
    container-type: inline-size; z-index: 4;
    transition: transform .3s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .env-scene:hover { transform: translateY(-4px); }
  .env-scene:focus-visible { outline: 2px solid var(--terra); outline-offset: 4px; border-radius: 6px; }
  .env-scene img { display: block; width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 18px 34px rgba(74,36,22,.18)); }
  /* monogramme D·H gravé à l'or, à la place du GA du modèle */
  .env-mono {
    position: absolute; left: 50.2%; top: 35.5%; transform: translate(-50%, -50%);
    font-family: 'Monsieur La Doulaise', 'Great Vibes', cursive; font-weight: 400;
    font-size: 15cqw; line-height: 1; white-space: nowrap; letter-spacing: -.04em;
    background: linear-gradient(160deg, #e9c98a 0%, #c39445 38%, #9a6a1c 70%, #c99a4c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 rgba(255,250,240,.7)) drop-shadow(0 -1px 0 rgba(120,80,20,.25));
    pointer-events: none;
  }
  .env-mono span { margin-left: -.08em; }

  .env-scene.opening { animation: env-pop .5s ease; }
  @keyframes env-pop { 40% { transform: scale(1.04); } }
  .env-scene.away {
    transform: translateY(110vh) rotate(-5deg); opacity: .3;
    transition: transform .95s cubic-bezier(.55,0,.7,.45) .5s, opacity .65s ease .6s;
  }
  .env-scene.bye { display: none; }

  /* ---------- photo révélée après l'ouverture ---------- */
  .photo-stage {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(78vw, 340px); aspect-ratio: 3 / 4;
    z-index: 1;
  }
  .photo-card {
    position: absolute; inset: 0;
    border-radius: 14px; overflow: hidden;
    background: linear-gradient(160deg, #fdf8f2, #ecd9c0);
    border: 1px solid rgba(184,92,56,.25);
    box-shadow: 0 26px 60px rgba(74,36,22,.28), inset 0 0 0 5px rgba(201,165,94,.22);
    opacity: 0; transform: translateY(26px) scale(.94);
    transition: opacity .8s ease 1s, transform 1s cubic-bezier(.2,.85,.3,1.05) 1s;
  }
  .photo-card.show { opacity: 1; transform: translateY(0) scale(1); }
  .photo-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-card img.hidden { display: none; }
  .ph-mono {
    display: none; position: absolute; inset: 0;
    align-items: center; justify-content: center; flex-direction: column; gap: 4px;
    font-family: 'Monsieur La Doulaise','Great Vibes', cursive; font-size: clamp(40px, 12.6vw, 58px); font-weight: 400;
    letter-spacing: 0; color: var(--deep);
    background: linear-gradient(160deg, #f6ede3, #ecd9c0);
  }
  .ph-mono span { font-family: 'Monsieur La Doulaise','Great Vibes', cursive; font-size: .78em; color: var(--gold-deep); white-space: nowrap; }
  .ph-mono .line { display: block; text-align: center; }
  .ph-mono .fn { white-space: nowrap; }
  .photo-card.nophoto .ph-mono { display: flex; }
  .photo-card::after {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(255,251,244,.6); border-radius: 9px;
    pointer-events: none; z-index: 2;
  }

  /* CTA sur la photo : capitales espacées (le script est réservé aux prénoms) */
  .open-cta {
    position: absolute; left: 50%; bottom: 20px;
    transform: translateX(-50%) translateY(12px);
    opacity: 0; z-index: 3;
    display: inline-block; text-decoration: none; cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px; font-weight: 500; line-height: 1; letter-spacing: .22em; text-transform: uppercase;
    color: #fff8f0; text-align: center; white-space: nowrap;
    padding: 13px 30px;
    background: linear-gradient(100deg, rgba(138,52,22,.9), rgba(184,92,56,.85) 50%, rgba(138,52,22,.9));
    border-radius: 2px;
    border: 1px solid rgba(232,181,154,.7);
    box-shadow: 0 8px 26px rgba(74,36,22,.4);
    text-shadow: 0 2px 8px rgba(74,36,22,.4);
    backdrop-filter: blur(3px);
    transition: opacity .6s ease 1.7s, transform .6s ease 1.7s, box-shadow .25s ease, background .25s ease;
  }
  .photo-card.show .open-cta { opacity: 1; transform: translateX(-50%) translateY(0); }
  .open-cta:hover { box-shadow: 0 10px 30px rgba(74,36,22,.5); background: linear-gradient(100deg, rgba(184,92,56,.95), rgba(201,123,78,.9) 50%, rgba(184,92,56,.95)); }

  /* écrans bas (paysage mobile) : on resserre */
  @media (max-height: 640px) {
    .ih-hint { margin-top: 12px; }
    .env-scene { width: min(100vw, 460px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .env-scene, .photo-card, .open-cta, .intro-head { transition-duration: .01s !important; transition-delay: 0s !important; }
    .ih-chev { animation: none; }
  }
</style>

    <header class="intro-head">
      <p class="ih-kicker">Invitation au</p>
      <h1 class="ih-title">Mariage de</h1>
      <img class="ih-filet" src="assets/invitation/filet.png" alt="" aria-hidden="true" width="1250" height="54">

        <path d="M1.5 1.5 L11 10 L20.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </header>

    <div class="photo-stage">
      <div class="photo-card" id="photoCard">
        <img id="phImg" src="photo-couple.jpg" alt="Daria &amp; Hermann"
             onerror="this.classList.add('hidden');document.getElementById('photoCard').classList.add('nophoto')">
        <div class="ph-mono"><span class="line"><span class="fn">Daria</span> <span>&amp;</span></span><span class="line"><span class="fn">Hermann</span></span></div>
        <button class="open-cta" id="openCta" type="button">Ouvrir l'invitation</button>
      </div>
    </div>

    <button class="env-scene" id="envScene" type="button" aria-label="Ouvrir l'enveloppe">
      <img src="assets/invitation/enveloppe.webp" alt="" width="1200" height="600" fetchpriority="high">
      <span class="env-mono" aria-hidden="true">D<span>H</span></span>
    </button>
  </div>

  <script>
    (function () {
      var intro = document.getElementById('intro');
      var envScene = document.getElementById('envScene');
      var photoCard = document.getElementById('photoCard');
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function openEnvelope() {
        if (intro.classList.contains('open')) return;
        intro.classList.add('open');
        envScene.classList.add('opening');
        setTimeout(function () { envScene.classList.remove('opening'); }, 520);

        /* l'enveloppe glisse hors de l'écran, la photo apparaît au centre */
        setTimeout(function () {
          photoCard.classList.add('show');
          envScene.classList.add('away');
        }, reduced ? 0 : 450);
        setTimeout(function () { envScene.classList.add('bye'); }, reduced ? 100 : 2100);
      }

      envScene.addEventListener('click', openEnvelope);

      /* CTA sur la photo → page RSVP ancrée sur les réservations */
      document.getElementById('openCta').addEventListener('click', function (e) {
        e.stopPropagation();
        intro.classList.add('fade');
        setTimeout(function () {
          window.location.href = 'invitation-landing.html#reserver';
        }, reduced ? 30 : 500);
      });
    })();
  </script>
