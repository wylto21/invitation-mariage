<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daria &amp; Hermann — Invitation · 18 décembre 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6ede3;          /* crème chaud */
    --bg2: #f1e4d6;
    --deep: #8a3416;        /* terracotta foncé */
    --terra: #b85c38;       /* terracotta */
    --terra-light: #c97b4e; /* terracotta clair */
    --sand: #a8865e;        /* sable doré */
    --gold: #c9a55e;        /* or de l'arc */
    --ink: #4a2416;
    --muted: #a8865e;
    --cream: #fdf8f2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background:
      radial-gradient(60% 45% at 8% 6%, rgba(184,92,56,.14) 0%, transparent 60%),
      radial-gradient(55% 42% at 94% 12%, rgba(201,123,78,.12) 0%, transparent 60%),
      radial-gradient(55% 45% at 92% 94%, rgba(168,134,94,.18) 0%, transparent 62%),
      radial-gradient(48% 40% at 6% 92%, rgba(184,92,56,.12) 0%, transparent 60%),
      #e8d9c5;
    font-family: 'Jost', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  [hidden] { display: none !important; }
  .env-scene { cursor: pointer; }
  .env-scene.open { cursor: default; }
  .env-scene.bye { display: none; }
  .card.revealed { animation: card-in .8s ease both; }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(18px) scale(.985); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- LA CARTE ---------- */
  .card {
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
    width: 100%;
    max-width: 480px;
    aspect-ratio: 9 / 16;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 46px 34px;
    box-shadow: 0 24px 70px rgba(74,36,22,.25);
    border: 1px solid rgba(184,92,56,.14);
    position: relative;
    overflow: hidden;
  }

  /* halo doux au centre, comme la lumière de l'affiche */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(58% 42% at 50% 40%, rgba(255,251,244,.85) 0%, transparent 70%);
    pointer-events: none;
  }

  /* arc doré décoratif */
  .arc {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    width: 78%;
    aspect-ratio: 1 / 1.22;
    pointer-events: none;
  }
  .arc svg { width: 100%; height: 100%; display: block; }

  /* feuillages stylisés aux coins (évoquent les palmes/fleurs) */
  .leaf { position: absolute; width: 110px; height: 110px; pointer-events: none; opacity: .8; }
  .leaf svg { width: 100%; height: 100%; }
  .leaf.tl { top: -24px; left: -24px; }
  .leaf.tr { top: -24px; right: -24px; transform: scaleX(-1); }
  .leaf.bl { bottom: -24px; left: -24px; transform: scaleY(-1); }
  .leaf.br { bottom: -24px; right: -24px; transform: scale(-1); }

  .content { position: relative; z-index: 2; width: 100%; }

  /* mention manuscrite en haut à droite */
  .motto-script { position: absolute; top: 30px; right: 26px; text-align: right; z-index: 3; }
  .motto-script .ms1 { font-family: 'Great Vibes', cursive; font-size: 21px; line-height: 1.15; color: var(--deep); }
  .motto-script .ms2 { margin-top: 6px; color: var(--terra); font-size: 12px; }

  /* listes de mots à gauche */
  .motto-list {
    position: absolute; bottom: 26px; left: 24px; top: auto; text-align: left;
    display: flex; flex-direction: column; gap: 5px;
    font-size: 8.5px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--deep); font-weight: 500; z-index: 3; opacity: .85;
  }
  .motto-list .hh { color: var(--terra); border-top: 1px solid rgba(184,92,56,.3); padding-top: 7px; margin-top: 4px; }

  .kicker { font-size: 10px; letter-spacing: .42em; text-transform: uppercase; color: var(--muted); font-weight: 400; }

  /* séparateur avec anneaux entrelacés */
  .sep { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 6px 0 4px; }
  .sep i { width: 54px; height: 1px; background: linear-gradient(90deg, transparent, rgba(184,92,56,.55)); }
  .sep i:last-child { transform: scaleX(-1); }
  .sep .rings { color: var(--terra); font-size: 13px; }

  /* prénoms — script terracotta, titre principal */
  .names {
    font-family: 'Great Vibes', cursive; font-weight: 400;
    font-size: clamp(46px, 11.5vw, 60px); line-height: 1.15;
    color: var(--terra); margin: 8px 0 4px;
  }
  .names .amp { font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--deep); font-size: .62em; margin: 0 .12em; }

  .date-line { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 14.5px; font-weight: 500; letter-spacing: .04em; color: var(--ink); margin-top: 4px; }
  .date-line .ic { color: var(--deep); font-size: 15px; }
  .venue-line { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 13.5px; letter-spacing: .02em; color: var(--ink); margin-top: 7px; }
  .venue-line .ic { color: var(--deep); font-size: 14px; }
  .hours { margin-top: 10px; font-weight: 300; font-size: 12px; letter-spacing: .06em; color: var(--ink); }
  .theme-line { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: var(--deep); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .theme-line b { color: var(--terra); font-weight: 600; }
  .theme-line .sprig { color: var(--sand); font-size: 13px; }

  /* bandeau doré brossé « Merci de réserver cette date » */
  .banner {
    margin-top: 16px; display: inline-block; position: relative;
    padding: 10px 30px; color: var(--cream);
    font-size: 11.5px; font-weight: 500; letter-spacing: .12em;
  }
  .banner::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(100deg, rgba(201,165,94,.92), rgba(212,178,116,.78) 45%, rgba(201,165,94,.92));
    border-radius: 3px 14px 4px 12px / 12px 4px 14px 5px; /* aspect "coup de pinceau" */
    box-shadow: 0 4px 14px rgba(168,134,94,.4);
  }

  .rsvp-link {
    margin-top: 14px; display: inline-block;
    font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--terra); text-decoration: none;
    border-bottom: 1px solid rgba(184,92,56,.4); padding-bottom: 3px; transition: .25s;
  }
  .rsvp-link:hover { color: var(--deep); border-color: var(--deep); }

  /* ---------- scène photo (au centre, derrière l'enveloppe) ---------- */
  .photo-stage {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(78vw, 320px); aspect-ratio: 3 / 4;
    z-index: 1;
  }
  .photo-card {
    position: absolute; inset: 0;
    border-radius: 14px; overflow: hidden;
    background: linear-gradient(160deg, #f6ede3, #ecd9c0);
    border: 1px solid rgba(184,92,56,.25);
    box-shadow: 0 24px 60px rgba(74,36,22,.35), inset 0 0 0 5px rgba(201,165,94,.22);
    opacity: 0; transform: translateY(26px) scale(.94);
    transition: opacity .8s ease 1.25s, transform 1s cubic-bezier(.2,.85,.3,1.05) 1.25s;
  }
  .photo-card.show { opacity: 1; transform: translateY(0) scale(1); }
  .photo-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-card img.hidden { display: none; }
  .ph-mono {
    display: none; position: absolute; inset: 0;
    align-items: center; justify-content: center; flex-direction: column; gap: 4px;
    font-family: 'Great Vibes', cursive; font-size: 46px; color: var(--terra);
    background: linear-gradient(160deg, #f6ede3, #ecd9c0);
  }
  .ph-mono span { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: .55em; color: var(--deep); }
  .photo-card.nophoto .ph-mono { display: flex; }
  .photo-card::after {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(255,251,244,.55); border-radius: 9px;
    pointer-events: none; z-index: 2;
  }

  /* CTA Great Vibes par-dessus la photo */
  .open-cta {
    position: absolute; left: 50%; bottom: 20px;
    transform: translateX(-50%) translateY(12px);
    opacity: 0; z-index: 3;
    display: inline-block; text-decoration: none; cursor: pointer;
    font-family: 'Great Vibes', cursive;
    font-size: 28px; line-height: 1;
    color: #fff8f0; text-align: center; white-space: nowrap;
    padding: 10px 28px 14px;
    background: linear-gradient(100deg, rgba(138,52,22,.88), rgba(184,92,56,.8) 50%, rgba(138,52,22,.88));
    border-radius: 40px;
    border: 1px solid rgba(201,165,94,.7);
    box-shadow: 0 6px 22px rgba(74,36,22,.45);
    text-shadow: 0 2px 8px rgba(74,36,22,.5);
    backdrop-filter: blur(3px);
    transition: opacity .6s ease 2s, transform .6s ease 2s, box-shadow .25s ease, background .25s ease;
  }
  .photo-card.show .open-cta { opacity: 1; transform: translateX(-50%) translateY(0); }
  .open-cta:hover { box-shadow: 0 10px 30px rgba(74,36,22,.6); background: linear-gradient(100deg, rgba(138,52,22,.95), rgba(184,92,56,.9) 50%, rgba(138,52,22,.95)); }

  @media (prefers-reduced-motion: reduce) {
    .env-scene, .env-flap, .photo-card, .open-cta, .wax-seal { transition-duration: .01s !important; transition-delay: 0s !important; }
  }

  .foot { margin-top: 12px; font-size: 9px; letter-spacing: .34em; text-transform: uppercase; color: var(--muted); }

  /* ============================================================
     INTRO : ENVELOPPE FLEURIE → PHOTO → CTA
     ============================================================ */
  .intro {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(60% 45% at 8% 6%, rgba(184,92,56,.14) 0%, transparent 60%),
      radial-gradient(55% 42% at 94% 12%, rgba(201,123,78,.12) 0%, transparent 60%),
      radial-gradient(55% 45% at 92% 94%, rgba(168,134,94,.18) 0%, transparent 62%),
      radial-gradient(48% 40% at 6% 92%, rgba(184,92,56,.12) 0%, transparent 60%),
      #e8d9c5;
    perspective: 1200px;
    overflow: hidden;
    transition: opacity .55s ease;
  }
  .intro.fade { opacity: 0; }
  .intro.gone { display: none; }

  .env-scene {
    position: absolute; left: 50%; top: 50%;
    width: min(86vw, 340px); aspect-ratio: 10 / 7;
    transform: translate(-50%, -50%);
    z-index: 4;
    perspective: 1000px;
    transition: transform .3s ease, opacity .65s ease .8s;
  }
  .env-scene:not(.open):hover { transform: translate(-50%, -52%); }
  .env-scene.away {
    transform: translate(-50%, 120vh) rotate(-6deg); opacity: .35;
    transition: transform .95s cubic-bezier(.55,0,.7,.45) .7s, opacity .65s ease .8s;
  }
  .env-scene.opening { animation: env-pop .5s ease; }
  @keyframes env-pop {
    0% { transform: translate(-50%, -50%) scale(1); }
    40% { transform: translate(-50%, -50%) scale(1.05); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  /* corps de l'enveloppe */
  .env-body {
    position: absolute; inset: 0;
    background: linear-gradient(165deg, #fdf8f2 0%, #f6ede3 55%, #f0e0cd 100%);
    border: 1px solid rgba(184,92,56,.22);
    border-radius: 8px;
    box-shadow: 0 18px 50px rgba(74,36,22,.22), inset 0 0 0 4px rgba(201,165,94,.18);
    z-index: 2;
  }
  .env-body::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 62%;
    background: linear-gradient(170deg, rgba(184,92,56,.07), rgba(184,92,56,.13));
    clip-path: polygon(0 100%, 50% 12%, 100% 100%);
    border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
    pointer-events: none;
  }
  .env-sprig { position: absolute; width: 74px; height: 74px; pointer-events: none; opacity: .95; }
  .env-sprig.bl { left: 8px; bottom: 8px; }
  .env-sprig.br { right: 8px; bottom: 8px; transform: scaleX(-1); }

  /* rabat supérieur qui pivote */
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%;
    transform-origin: top center;
    z-index: 6;
    transition: transform .8s cubic-bezier(.65,-0.25,.35,1.25) .1s;
  }
  .env-flap::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, #f3e6d4 0%, #ecd9c0 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-top-left-radius: 8px; border-top-right-radius: 8px;
    border: 1px solid rgba(184,92,56,.18);
    box-shadow: 0 6px 16px rgba(74,36,22,.14);
    backface-visibility: hidden;
  }
  .flap-art {
    position: absolute; inset: 0;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    pointer-events: none;
  }
  .flap-art .cluster { position: absolute; left: 50%; bottom: 3%; width: 86%; transform: translateX(-50%); }
  .flap-art .bud { position: absolute; width: 16px; height: 16px; }
  .flap-art .bud.l { left: 9%; top: 18%; }
  .flap-art .bud.r { right: 9%; top: 18%; }
  .env-scene.open .env-flap { transform: rotateX(178deg); z-index: 0; }

  /* cachet de cire */
  .wax-seal {
    position: absolute; left: 50%; top: 55%;
    transform: translate(-50%, -50%);
    width: 62px; height: 62px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #d4794b, #b85c38 55%, #8a3416 100%);
    box-shadow: 0 4px 14px rgba(138,52,22,.45), inset 0 2px 6px rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center;
    z-index: 7; cursor: pointer; border: none; padding: 0;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .wax-seal:hover { transform: translate(-50%, -50%) scale(1.08); }
  .wax-seal svg { width: 34px; height: 34px; }
  .wax-seal::before {
    content: ""; position: absolute; inset: -12px; border-radius: 50%;
    border: 2px solid rgba(184,92,56,.5);
    animation: seal-pulse 2.2s ease-out infinite;
  }
  @keyframes seal-pulse {
    0% { transform: scale(.85); opacity: .9; }
    70% { transform: scale(1.35); opacity: 0; }
    100% { opacity: 0; }
  }
  .env-scene.open .wax-seal { animation: seal-fade .5s ease forwards; pointer-events: none; }
  @keyframes seal-fade { to { opacity: 0; transform: translate(-50%, -50%) scale(.6); } }


  @media (max-width: 400px) {
    .card { padding: 40px 22px; }
    .motto-list { left: 14px; }
    .motto-script { right: 16px; }
  }
</style>
</head>
<body>

  <!-- ============ INTRO : ENVELOPPE FLEURIE ============ -->
  <div class="intro" id="intro">
    <div class="photo-stage">
      <div class="photo-card" id="photoCard">
        <img id="phImg" src="photo-couple.jpg" alt="Daria &amp; Hermann"
             onerror="this.classList.add('hidden');document.getElementById('photoCard').classList.add('nophoto')">
        <div class="ph-mono">Daria <span>&amp;</span> Hermann</div>
        <button class="open-cta" id="openCta" type="button">Ouvrez l'invitation</button>
      </div>
    </div>

    <div class="env-scene" id="envScene">
      <div class="env-body">
        <svg class="env-sprig bl" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <path d="M10 92 C 26 74, 40 52, 46 22" stroke="#b9855c" stroke-width="2"/>
          <path d="M24 74 C 34 70, 46 70, 55 74" stroke="#b9855c" stroke-width="1.5" opacity=".75"/>
          <path d="M31 58 C 41 53, 52 52, 61 56" stroke="#b9855c" stroke-width="1.5" opacity=".75"/>
          <path d="M38 42 C 47 37, 57 36, 65 40" stroke="#b9855c" stroke-width="1.5" opacity=".75"/>
          <circle cx="47" cy="15" r="5" fill="#c97b4e"/>
          <circle cx="58" cy="24" r="3" fill="#c9a55e" opacity=".9"/>
          <circle cx="38" cy="27" r="3" fill="#c9a55e" opacity=".9"/>
        </svg>
        <svg class="env-sprig br" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <path d="M10 92 C 26 74, 40 52, 46 22" stroke="#b9855c" stroke-width="2"/>
          <path d="M24 74 C 34 70, 46 70, 55 74" stroke="#b9855c" stroke-width="1.5" opacity=".75"/>
          <path d="M31 58 C 41 53, 52 52, 61 56" stroke="#b9855c" stroke-width="1.5" opacity=".75"/>
          <path d="M38 42 C 47 37, 57 36, 65 40" stroke="#b9855c" stroke-width="1.5" opacity=".75"/>
          <circle cx="47" cy="15" r="5" fill="#c97b4e"/>
          <circle cx="58" cy="24" r="3" fill="#c9a55e" opacity=".9"/>
          <circle cx="38" cy="27" r="3" fill="#c9a55e" opacity=".9"/>
        </svg>
      </div>

      <div class="env-flap" id="envFlap">
        <div class="flap-art" aria-hidden="true">
          <svg class="cluster" viewBox="0 0 220 64" fill="none">
            <path d="M110 60 C 96 44, 82 34, 62 30" stroke="#b9855c" stroke-width="1.8"/>
            <path d="M110 60 C 124 44, 138 34, 158 30" stroke="#b9855c" stroke-width="1.8"/>
            <path d="M110 58 C 104 40, 102 26, 106 10" stroke="#b9855c" stroke-width="1.8"/>
            <circle cx="106" cy="8" r="6" fill="#c97b4e"/>
            <circle cx="60" cy="28" r="5" fill="#c97b4e"/>
            <circle cx="160" cy="28" r="5" fill="#c97b4e"/>
            <circle cx="84" cy="34" r="3" fill="#c9a55e"/>
            <circle cx="136" cy="34" r="3" fill="#c9a55e"/>
            <circle cx="96" cy="20" r="3" fill="#c9a55e"/>
            <circle cx="124" cy="20" r="3" fill="#c9a55e"/>
          </svg>
          <svg class="bud l" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#c97b4e" opacity=".9"/><circle cx="7" cy="7" r="2.5" fill="#f3d9b1" opacity=".8"/></svg>
          <svg class="bud r" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#c97b4e" opacity=".9"/><circle cx="7" cy="7" r="2.5" fill="#f3d9b1" opacity=".8"/></svg>
        </div>
        <button class="wax-seal" id="seal" type="button" aria-label="Ouvrir l'enveloppe">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 4 C 13 7, 16 8, 19 8 C 17 11, 17 14, 19 17 C 16 17, 13 18, 12 21 C 11 18, 8 17, 5 17 C 7 14, 7 11, 5 8 C 8 8, 11 7, 12 4 Z" fill="#f6e7cf" opacity=".95"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var intro = document.getElementById('intro');
      var envScene = document.getElementById('envScene');
      var photoCard = document.getElementById('photoCard');
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function openEnvelope() {
        if (envScene.classList.contains('open')) return;
        envScene.classList.add('opening');
        setTimeout(function () { envScene.classList.remove('opening'); }, 520);
        envScene.classList.add('open');

        /* la photo apparaît derrière l'enveloppe, puis celle-ci glisse hors de l'écran */
        setTimeout(function () {
          photoCard.classList.add('show');
          envScene.classList.add('away');
        }, reduced ? 0 : 700);
        setTimeout(function () { envScene.classList.add('bye'); }, reduced ? 100 : 2500);
      }

      /* clic sur le cachet, le rabat ou l'enveloppe entière → ouverture */
      document.getElementById('seal').addEventListener('click', function (e) { e.stopPropagation(); openEnvelope(); });
      envScene.addEventListener('click', openEnvelope);

      /* CTA sur la photo → page RSVP ancrée sur les réservations */
      document.getElementById('openCta').addEventListener('click', function (e) {
        e.stopPropagation();
        intro.classList.add('fade');
        setTimeout(function () {
          window.location.href = 'invitation-landing.html#reserver';
        }, reduced ? 30 : 500);
      });
    })();
  </script>

</body>
</html>
